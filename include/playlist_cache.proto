edition = "2024";

package proto;

message CacheHead {
	string next = 1;
	string etag = 2;
	uint32 sid_len = 3;
}

message Playlist {
	string id = 1;
	string etag = 2;
	string version = 3;
	string title = 4;
	bool is_private = 5;
	int32 items = 6;
	string short_id = 7;
}

message CacheNode {
	string next = 1;
	string prev = 2;
	Playlist playlist = 3;
	string items_id = 4;
	bytes id_hash = 5;
}
