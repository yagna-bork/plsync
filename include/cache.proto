edition = "2024";

package proto;

message CacheHead {
	bytes next = 1;
	string etag = 2;
}

message Playlist {
	string id = 1;
	bytes id_hash = 2;
	string etag = 3;
	string version = 4;
	string title = 5;
	bool is_private = 6;
	int32 items = 7;
	string items_id = 9;
	string items_etag = 10;
}

message CacheNode {
	bytes next = 1;
	bytes prev = 2;
	Playlist playlist = 3;
	string items_id = 4;
}

enum Platform {
	YOUTUBE = 0;
	SPOTIFY = 1;
	INVALID = 2;
}

message Song {
	repeated string artists = 1;
	string track = 2;
}

message PairPlatformPlaylist {
	Platform plat = 1;
	Playlist playlist = 2;
}

message PairSongItems {
    Song song = 1;
    repeated string items = 2;
}

message PlaylistItems {
	message SongCountPair {
		Song song = 1;
		uint32 cnt = 2;
	}

	repeated PairPlatformPlaylist tracked = 1;
	repeated PairSongItems song_to_items_entries = 2;
}

message PlaylistItemIdToSongMap {
	message Entry {
		string playlist_item_id = 1;
		Song song = 2;
	}

	message Bucket {
		repeated Entry entries = 1;
	}

	// map type exists but doing it manually for fun
	repeated Bucket buckets = 1;
}
