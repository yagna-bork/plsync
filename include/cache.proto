edition = "2024";

message PlaylistCacheEntry {
	string id = 1;
	string etag = 2;
	string title = 3;
	bool is_private = 4;
	int32 items = 5;
	bytes id_hash = 6;
}

message PlaylistCacheNode {
	PlaylistCacheEntry entry = 1;
	string next = 2;
}

// extra fields to store important info about the entire cache 
message PlaylistCacheHead {
	bool is_sorted = 100;
}
