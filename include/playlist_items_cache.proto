edition = "2024";

package proto;

enum Platform {
	YOUTUBE = 0;
	SPOTIFY = 1;
	INVALID = 2;
}

message PlaylistInfo {
	Platform plat = 1;
	string id = 2;
	string items_etag = 3;
	string title = 4; // denormalisation to save costly file reads just for this value
}

message PlaylistItems {
	repeated PlaylistInfo tracked_playlists = 1;
	repeated bytes song_hashes = 2;
}
